[package]
name = "eds_bevy_common"
version = "0.1.0"
edition = "2024"
authors = ["Ed Swartz (github.com/eswartz)"]
license = "MIT OR Apache 2"
categories = ["game"]


#########
# If you are using `webp` in glTF files via `bevy/webp`,
# then please copy this section into your project's `.cargo/config.toml`'s
# section so all clients will see the same patches.
# Explicitly reference these crates as well so the overrides will hold.
# (Without such edits, your project will have a separate copy of bevy
# and you'll get a lot of errors.)
#########
[patch.crates-io]
# bevy = { path = "../bevy-fork" }

# Support webp.
# See above to fix error: feature `reqs` includes `gltf/EXT_texture_webp`, but `gltf` is not a dependency
gltf = { git = "https://github.com/gltf-rs/gltf.git", branch = "main" }

#########

[features]
default = ["input_bei", "highlighting", "grabbing", "firewheel", "experimental_pbr_pcss"]

trenchbroom = ["bevy_trenchbroom"]
input_bei = ["dep:bevy_enhanced_input"]
midi_synth = ["dep:rustysynth", "dep:xsynth-core", "dep:crossbeam-channel"]
highlighting = ["dep:bevy_mod_outline"]
grabbing = ["dep:bevy_mod_outline"]

firewheel = ["dep:bevy_seedling", "dep:firewheel"]
webgpu = ["bevy/webgpu"]
solari = ["bevy/bevy_solari"]

experimental_pbr_pcss = ["bevy/experimental_pbr_pcss"]
pbr_transmission_textures = ["bevy/pbr_transmission_textures"]
pbr_specular_textures = ["bevy/pbr_specular_textures"]
pbr_multi_layer_material_textures = ["bevy/pbr_multi_layer_material_textures"]
pbr_anisotropy_texture = ["bevy/pbr_anisotropy_texture"]

dev = [
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
    # Improve error messages coming from Bevy
    "bevy/track_location",
    "avian3d/diagnostic_ui",
]
dev_native = [
    "bevy/bevy_remote",
    # Enable asset hot reloading for native dev builds.
    "bevy/file_watcher",
    # Enable embedded asset hot reloading for native dev builds.
    "bevy/embedded_watcher",
    "bevy/webgpu",
]
web = [
    "bevy/webgpu",
    "bevy_seedling/web_audio",
]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "3d", "ui",

    "bevy_world_serialization",

    # And these optional:
    # "dev",
    "bevy_dev_tools",
    # "file_watcher",
    # "async-io", # no-go for web
    # "bevy_remote", # not gonna add it from a lib, but go for it (most is Reflect'able)
    "jpeg",
    "webp",
    "exr",
    "track_location",
    "asset_processor",

    "x11",
    "wayland",
    # "webgpu", # noooo not yet

    # "basis-universal",
    # "trace_tracy",
] }

# Common deps with bevy usage.
wgpu = "29"
rand = { version = "0.10.0" }

###
# Overridden above; need some record to override.
gltf = { version = "*" }

# avian3d = { git = "https://github.com/Jondolf/avian.git", branch = "main", default-features = false, features = [
# avian3d = { git = "https://github.com/Jondolf/avian.git", rev = "442af791512dfc369b41bd8718878df7e0ab26dd", default-features = false, features = [
avian3d = { version = "0.8.0-dev", default-features = false, features = [
	"3d",
	"collider-from-mesh",
    # "f32",
    "parry-f32",
    #  "f64", "parry-f64",
    "bevy_scene",
    "bevy_picking",
    "diagnostic_ui",
    "debug-plugin",
    # "validate",  # has crash
    "xpbd_joints", # optional
    "serialize",
] }
bevy-inspector-egui = { git = "ssh://git@github.com/eswartz/bevy-inspector-egui-fork.git", branch = "main", default-features = false, features = ["bevy", "bevy_gizmos", "egui_clipboard" ] } #, "documentation"] } #"highlight_changes"] }
bevy_egui = { version = "0.41", features = ["render", "serde"] }
egui = { version = "0.35", features = ["bytemuck"] }

# # We must mention it and maintain the version because of the override below for wasm.
firewheel = { version = "0.12", optional = true }
# firewheel = { git = "https://github.com/BillyDM/Firewheel", rev = "fdf9fbb" }

bevy_seedling = { version = "0.8.0", optional = true, default-features = false, features = [
    "wav", "ogg", "rand", "reflect", "diagnostics",
    "hrtf",
    "cpal",
    "web_audio",

    "loudness",
    # "dev",
    # 0.10
    # "stream",
    # "scheduled_events",

    # 0.11
    "effects",
] }

bevy_skein = { version = "0.6.0", optional = true }

bevy_enhanced_input = { version = "0.26", features = ["reflect", "state", "serialize"], optional = true }

bevy_common_assets = { version = "0.17.0", features = ["ron"] }
bevy_asset_loader = { version = "0.27.0", features = [
    "2d",
    "3d",
    "standard_dynamic_assets",
    # "progress_tracking",
] }

bevy_trenchbroom = { version = "0.14.0-rc.2", optional = true, default-features = false, features = [ "bsp", "client", "physics-integration" ] }

bevy_mod_outline = { version = "0.13", optional = true }

bevy_tweening = "0.16.0"

log = { version = "0.4", features = [
    "max_level_debug",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
] }
rustc-hash = "2.1.1"
regex = "1.12"

strum = { version = "0.27.2", features = ["derive", "strum_macros"] }
strum_macros = "0.27.2"

bytemuck = "1.25.0"
anyhow = "1.0.101"
thiserror = { version = "2.0.12" }
derive-debug = "0.1.2"

obj = "0.10"
serde = { version = "1.0", features = ["alloc", "derive", "serde_derive"] }

getrandom = { version = "0.4.1", features = ["wasm_js"]}
image = { version = "0.25", default-features = false }

sysinfo = { version = "0.37" }

rustysynth = { version = "1.3", optional = true }
xsynth-core = { version = "0.4", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
fuzzy-matcher = "0.3.7"

console_log = "1"

wasm_thread = "0.3"
wasm-bindgen = { version = "0.2.120" }

lru = "0.18.1"
bwavfile = "2.0.1"
dasp-rs = "0.5.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# firewheel = {  git = "https://github.com/BillyDM/Firewheel", rev = "fdf9fbb", optional = true, default-features = false, features = [
firewheel = { version = "0.12", optional = true, default-features = false, features = [
  "wasm-bindgen",
] }

[profile.dev]
debug = "line-tables-only"

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
# codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
# lto = "thin"
# opt-level = 1

[dev.dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "3d", "ui",

    # And these optional:
    # "dev",
    "bevy_dev_tools",
    # "file_watcher",
    # "async-io", # no-go for web
    # "bevy_remote", # not gonna add it from a lib, but go for it (most is Reflect'able)
    "jpeg",
    "webp",
    "exr",
    "track_location",
    "asset_processor",
    "experimental_pbr_pcss",

    "x11",
    "wayland",
    # "webgpu", # noooo not yet

    # "basis-universal",
    # "trace_tracy",
] }

[[example]]
name = "game_menu"
required-features = ["input_bei", "bevy_skein"]

[[example]]
name = "sound_chain"
required-features = ["firewheel", "input_bei", "bevy_skein", "midi_synth"]

# [[example]]
# name = "time_stretcher"
# required-features = ["firewheel"]

###########
###########

[lints.clippy]
# pedantic = { level = "warn", priority = -1 }
# restriction = { level = "warn", priority = -1 }

# blanket_clippy_restriction_lints = "allow"
# pub_with_shorthand = "allow"
# single_char_lifetime_names = "allow"
# field_scoped_visibility_modifiers = "allow"
# else-if-without-else = "allow"
# unseparated_literal_suffix = "allow"
# allow_attributes = "allow"
# allow_attributes_without_reason = "allow"
# partial_pub_fields = "allow"
# similar_names = "allow"
# pub_use = "allow"

# missing_errors_doc = "allow"
# missing_inline_in_public_items = "allow"

# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
# arithmetic_side_effects = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"  # only relevant on editions before 2024
large_futures = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
# Optional - these effectively force you to document numeric invariants
# cast_possible_wrap = "warn"
# cast_precision_loss = "warn"
# cast_possible_truncation = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# This is expected in Bevy
type_complexity = "allow"
too_many_arguments = "allow"

